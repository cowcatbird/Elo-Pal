name: Feature request
description: Suggest a useful improvement to Elo Pal.
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the study or review task that is difficult today.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested improvement
      description: Explain how it would help. Screenshots or examples are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
